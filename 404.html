<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>PKXD Central</title>
    <script type="text/javascript">
      // SPA Single-Page App redirect for GitHub Pages / Static Hosting
      // Preserves subpaths like /inscricoes, /admin, /eventos, /artes on reload
      var segmentCount = 0;
      var l = window.location;
      
      // If deployed on github.io/repo-name/, count path segment
      if (l.hostname.indexOf('github.io') !== -1) {
        var pathSegments = l.pathname.split('/').filter(Boolean);
        if (pathSegments.length > 0) {
          // If first segment is repo name
          var specialRoutes = ['admin', 'inscricoes', 'artes', 'eventos', 'comunidade', 'missoes', 'passaporte'];
          if (specialRoutes.indexOf(pathSegments[0].toLowerCase()) === -1) {
            segmentCount = 1;
          }
        }
      }

      var pathSegmentsToKeep = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        encodeURIComponent(pathSegmentsToKeep) +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body>
    <p>Redirecionando para PKXD Central...</p>
  </body>
</html>
